name: Deploy Website ke cPanel
on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Upload via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode terbaru
        uses: actions/checkout@v4

      - name: Sync file ke cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 103.167.113.158
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./14-akun-game-nazil.smkwikrama1jepara.sch.id/
          protocol: ftps
          port: 21
          security: loose
